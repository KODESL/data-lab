[project]
name = "madrid"
version = "0.1.0"
description = "Madrid municipios: data pipeline, Living-Standards Index and forecasting lab"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Full analysis stack used by the notebooks and the training jobs
models = [
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "linearmodels>=6.0",
    "mapie>=0.8",
    "shap>=0.45",
    "pandera>=0.19",
    "mlflow>=2.12",
]
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "libpysal>=4.10",
    "esda>=2.5",
    "spreg>=1.4",
    "scipy>=1.12",
]
lab = [
    "jupyterlab>=4.1",
    "ipykernel",
    "matplotlib>=3.8",
    "plotly>=5.20",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
madrid = "madrid.jobs:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/madrid"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
